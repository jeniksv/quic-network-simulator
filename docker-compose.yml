version: "3.5"

services:
  sim:
    build: ./sim
    image: qns-sim:local
    container_name: sim
    hostname: sim
    cpuset: ${SIM_CPUS}
    stdin_open: true
    tty: true
    volumes:
      - ${RUN_DIR}/sim:/logs
    environment:
      - "SCENARIO=$SCENARIO --ns3::ArpCache::PendingQueueSize=10000 --ns3::RealtimeSimulatorImpl::SynchronizationMode=HardLimit --ns3::RealtimeSimulatorImpl::HardLimit=$HARD_LIMIT"
      - CAPTURE=$CAPTURE
    cap_add: 
      - NET_ADMIN
    expose:
      - "57832"
    networks:
      leftnet:
        ipv4_address: 193.167.0.2
        ipv6_address: fd00:cafe:cafe:0::2
        interface_name: eth0
      rightnet:
        ipv4_address: 193.167.100.2
        ipv6_address: fd00:cafe:cafe:100::2
        interface_name: eth1

  server:
    build: ./$SERVER
    image: $SERVER
    container_name: server
    hostname: server
    cpuset: ${SERVER_CPUS}
    stdin_open: true
    tty: true
    volumes:
      - ${RUN_DIR}/server:/usr/local/nginx/logs
      - ${RUN_DIR}/conf:/usr/local/nginx/conf:ro
      - ./benchmark/certs:/certs:ro
      - ./benchmark/www:/www:ro
    environment:
      - ROLE=server
      - SERVER_PARAMS=$SERVER_PARAMS
    depends_on:
      - sim
    healthcheck:
      test: ["CMD-SHELL", "ss -H -lun 'sport = :443' | grep -q ."]
      interval: 10s
      timeout: 1s
      retries: 1
      start_period: 30s
      start_interval: 250ms
    cap_add: 
      - NET_ADMIN
    networks:
      rightnet:
        ipv4_address: 193.167.100.100
        ipv6_address: fd00:cafe:cafe:100::100
    extra_hosts:
      - "client4:193.167.0.100"
      - "client6:fd00:cafe:cafe:0::100"
      - "client46:193.167.0.100"
      - "client46:fd00:cafe:cafe:0::100"

  client:
    build: ./$CLIENT
    image: $CLIENT
    container_name: client
    hostname: client
    cpuset: ${CLIENT_CPUS}
    stdin_open: true
    tty: true
    volumes:
      - ${RUN_DIR}/client:/logs
    environment:
      - ROLE=client
      - CLIENT_PARAMS=$CLIENT_PARAMS
    depends_on:
      sim:
        condition: service_started
      server:
        condition: service_healthy
    cap_add: 
      - NET_ADMIN
    networks:
      leftnet:
        ipv4_address: 193.167.0.100
        ipv6_address: fd00:cafe:cafe:0::100
    extra_hosts:
      - "server4:193.167.100.100"
      - "server6:fd00:cafe:cafe:100::100"
      - "server46:193.167.100.100"
      - "server46:fd00:cafe:cafe:100::100"

networks:
  leftnet:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: 'false'
    enable_ipv6: true
    ipam:
      config:
        - subnet: 193.167.0.0/24
        - subnet: fd00:cafe:cafe:0::/64
  rightnet:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: 'false'
    enable_ipv6: true
    ipam:
      config:
        - subnet: 193.167.100.0/24
        - subnet: fd00:cafe:cafe:100::/64
